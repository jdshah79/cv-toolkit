<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Object Detection Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #4caf50;
            margin-bottom: 10px;
        }
        .container {
            max-width: 800px;
            text-align: center;
            background: #2a2a35;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .video-box {
            border: 4px solid #4caf50;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            margin-top: 15px;
        }
        img {
            display: block;
            width: 100%;
            height: auto;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #bbb;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI Vision Feed</h1>
        <p>Real-time Object Detection using YOLOv8 & PyTorch</p>
        
        <div class="video-box">
            <img src="{{ url_for('video_feed') }}" alt="Live Camera Feed Loading...">
        </div>
        
        <div class="status">
            System Status: <span style="color: #4caf50; font-weight: bold;">● Live</span>
        </div>
    </div>

</body>
</html>
